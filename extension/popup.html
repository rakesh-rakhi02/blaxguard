<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BlaxGuard Shield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; padding: 16px; background: #0f172a; color: #f8fafc; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .title-wrap { display: flex; align-items: center; gap: 8px; }
    .logo-img { width: 28px; height: 28px; }
    .title { font-size: 16px; font-weight: 800; color: #38bdf8; }
    .status-badge { font-size: 11px; background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 3px 8px; border-radius: 99px; border: 1px solid rgba(16, 185, 129, 0.4); font-weight: 700; }
    
    .card { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .card-title { font-size: 12.5px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
    
    .input-box { width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 12.5px; resize: none; height: 56px; }
    .btn-check { width: 100%; margin-top: 8px; padding: 8px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .btn-check:hover { background: #1d4ed8; }

    #resultContainer { display: none; margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; }
    .res-safe { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #a7f3d0; }
    .res-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fecaca; }
    .res-caution { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #fde68a; }

    .footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; margin-top: 8px; }
    .dash-link { color: #38bdf8; text-decoration: none; font-weight: 600; cursor: pointer; }
    .dash-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-wrap">
      <img src="icon128.png" class="logo-img" alt="Shield">
      <span class="title">BlaxGuard</span>
    </div>
    <span class="status-badge">● Active Protection</span>
  </div>

  <div class="card">
    <div class="card-title">Quick Scam &amp; Loan Scanner:</div>
    <textarea id="quickInput" class="input-box" placeholder="Paste link, SMS, or loan name..."></textarea>
    <button id="btnScan" class="btn-check">🔍 Scan with RBI Registry</button>
    <div id="resultContainer"></div>
  </div>

  <div class="footer">
    <span>MHA / I4C Framework</span>
    <a href="http://localhost:8080" target="_blank" class="dash-link">Open Full App ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
